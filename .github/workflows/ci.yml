name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_job_hunt_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_job_hunt_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_job_hunt_os_ci?schema=public
      CONTAINER_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/ai_job_hunt_os_ci?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-outside-github-actions
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ci-placeholder-client-id
      AUTH_GITHUB_SECRET: ci-placeholder-client-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Build deployment images
        run: |
          docker build --target migration --tag ai-job-hunt-os-migration:ci .
          docker build --target runner --tag ai-job-hunt-os:ci .

      - name: Verify migration image
        run: >-
          docker run --rm
          --add-host host.docker.internal:host-gateway
          --env DATABASE_URL="${CONTAINER_DATABASE_URL}"
          ai-job-hunt-os-migration:ci

      - name: Start production image
        run: >-
          docker run --detach
          --name ai-job-hunt-os-smoke
          --add-host host.docker.internal:host-gateway
          --publish 3100:3000
          --env DATABASE_URL="${CONTAINER_DATABASE_URL}"
          --env AUTH_SECRET
          --env AUTH_TRUST_HOST
          --env AUTH_GITHUB_ID
          --env AUTH_GITHUB_SECRET
          ai-job-hunt-os:ci

      - name: Smoke test production image
        run: |
          test "$(docker image inspect ai-job-hunt-os:ci --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint sh ai-job-hunt-os:ci -c 'test ! -e /app/.env'
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health/ready; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              docker logs ai-job-hunt-os-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/health/live

      - name: Stop production image
        if: ${{ always() }}
        run: |
          if docker inspect ai-job-hunt-os-smoke >/dev/null 2>&1; then
            docker rm --force ai-job-hunt-os-smoke
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
