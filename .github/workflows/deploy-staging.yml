name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      deploy_render:
        description: Trigger Render after publishing and migrating (disable for the first bootstrap)
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  checks: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RUNNER_IMAGE: ghcr.io/${{ github.repository }}
  MIGRATION_IMAGE: ghcr.io/${{ github.repository }}-migration

jobs:
  verify-ci:
    name: Confirm CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require a successful CI check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Lint, build, and E2E" and .conclusion == "success")] | length'
          )"

          if [[ "${successful_runs}" == "0" ]]; then
            echo "Deploy refused: CI has not passed for ${GITHUB_SHA}."
            exit 1
          fi

  publish-runner:
    name: Publish runner image
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish runner
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  publish-migration:
    name: Publish migration image
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ghcr.io/${{ github.repository }}-migration@${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish migration image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.MIGRATION_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  release:
    name: Migrate and release staging
    needs: [publish-runner, publish-migration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      RUNNER_REF: ${{ needs.publish-runner.outputs.image }}
      MIGRATION_REF: ${{ needs.publish-migration.outputs.image }}
      STAGING_DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
      RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Validate staging configuration
        env:
          DEPLOY_RENDER: ${{ inputs.deploy_render }}
        run: |
          if [[ -z "${STAGING_DIRECT_DATABASE_URL}" ]]; then
            echo "STAGING_DIRECT_DATABASE_URL is not configured in the staging environment."
            exit 1
          fi

          if [[ "${DEPLOY_RENDER}" == "true" ]] && { [[ -z "${RENDER_STAGING_DEPLOY_HOOK_URL}" ]] || [[ -z "${STAGING_BASE_URL}" ]]; }; then
            echo "RENDER_STAGING_DEPLOY_HOOK_URL and STAGING_BASE_URL are required when deploy_render is enabled."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Apply Prisma migrations
        run: docker run --rm --env DATABASE_URL "${MIGRATION_REF}"

      - name: Promote the migrated runner image
        run: |
          docker buildx imagetools create \
            --tag "${RUNNER_IMAGE}:staging" \
            "${RUNNER_REF}"
          docker buildx imagetools inspect "${RUNNER_IMAGE}:staging"

      - name: Trigger immutable Render deployment
        if: ${{ inputs.deploy_render }}
        run: |
          encoded_image="$(jq -rn --arg image "${RUNNER_REF}" '$image | @uri')"
          separator="?"
          if [[ "${RENDER_STAGING_DEPLOY_HOOK_URL}" == *"?"* ]]; then
            separator="&"
          fi
          curl --fail-with-body --request POST \
            "${RENDER_STAGING_DEPLOY_HOOK_URL}${separator}imgURL=${encoded_image}"

      - name: Verify deployed revision and readiness
        if: ${{ inputs.deploy_render }}
        run: |
          expected_revision="${GITHUB_SHA}"

          for attempt in {1..60}; do
            response="$(curl --fail --silent --show-error "${STAGING_BASE_URL}/api/health/live" || true)"
            deployed_revision="$(jq --raw-output '.revision // empty' <<<"${response}" 2>/dev/null || true)"

            if [[ "${deployed_revision}" == "${expected_revision}" ]]; then
              curl --fail --silent --show-error "${STAGING_BASE_URL}/api/health/ready"
              echo
              echo "Staging is ready at ${STAGING_BASE_URL} (${expected_revision})."
              exit 0
            fi

            echo "Waiting for Render deployment (${attempt}/60, current revision: ${deployed_revision:-unavailable})..."
            sleep 10
          done

          echo "Timed out waiting for revision ${expected_revision}."
          exit 1
